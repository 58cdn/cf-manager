services:
  cf-manager:
    image: cf-manager
    container_name: cf-manager
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_SECRET=${API_SECRET:-}
      - UNLOCK_KEY=${UNLOCK_KEY:-}
      - AUTH_LOCKOUT_ENABLED=${AUTH_LOCKOUT_ENABLED:-true}
      - AUTH_LOCKOUT_ATTEMPTS=${AUTH_LOCKOUT_ATTEMPTS:-3}
      - AUTH_LOCKOUT_MINUTES=${AUTH_LOCKOUT_MINUTES:-5}
      - AUTH_LOCKOUT_REPEAT_MINUTES=${AUTH_LOCKOUT_REPEAT_MINUTES:-10}
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}
      - PROXY_URL=${PROXY_URL:-}
      - DEMO_ACCOUNT_IDS=${DEMO_ACCOUNT_IDS:-}
      - DB_PATH=/app/data/cf-manager.db
    volumes:
      - ./data:/app/data
